- name: Set zuul-log-path fact
  include_role:
    name: set-zuul-log-path-fact
  when: zuul_log_path is not defined

# Always upload (true), never upload (false) or only on failure ('failure')
- when: zuul_site_upload_logs | default(true) | bool or
        (zuul_site_upload_logs == 'failure' and not zuul_success | bool)
  block:
    # Use chmod instead of file because ansible 2.5 file with recurse and
    # follow can't really handle symlinks to .
    - name: Ensure logs are readable before uploading
      delegate_to: localhost
      shell: "chmod -R u=rwX,g=rX,o=rX {{ zuul.executor.log_root }}/"
      # ANSIBLE0007 chmod used in place of argument mode to file
      tags:
        - skip_ansible_lint

    - name: Upload logs to swift
      delegate_to: localhost
      zuul_swift_upload:
        cloud: "{{ zuul_log_cloud_config }}"
        partition: "{{ zuul_log_partition }}"
        container: "{{ zuul_log_container }}"
        public: "{{ zuul_log_container_public }}"
        prefix: "{{ zuul_log_path }}"
        indexes: "{{ zuul_log_create_indexes }}"
        files:
          - "{{ zuul.executor.log_root }}/"
        delete_after: "{{ zuul_log_delete_after | default(omit) }}"
      register: upload_results

- name: Return log URL to Zuul
  delegate_to: localhost
  zuul_return:
    data:
      zuul:
        log_url: "https://openstack-ci-reports.ubuntu.com/artifacts{{ upload_results.url.split('zosci-artifacts') | list | last }}/"
  when: upload_results is defined

# NOTE(freyes): Since zuul-4.7.0 the log url is no longer posted directly in
# gerrit, a url to zuul-web is used instead with the expectation that it's
# publicly available, for environments where this is not possible the suggestion
# is to publish the logs as an artifact, and this is what this task does.
#
# Ref: https://opendev.org/zuul/zuul/commit/1ee99f2fb270b298ba2bfe535164ef4ffc635b0d
# Ref: https://zuul-ci.org/docs/zuul/latest/releasenotes.html#relnotes-4-7-0-deprecation-notes
- name: Return log URL as an artifact
  when: upload_results is defined
  zuul_return:
    data:
      zuul:
        artifacts:
          - name: Build Log
            url: "https://openstack-ci-reports.ubuntu.com/artifacts{{ upload_results.url.split('zosci-artifacts') | list | last }}/"

